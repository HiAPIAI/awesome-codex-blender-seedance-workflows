name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Validate public JSON Schema with Ajv
        run: npm run test:schema
      - name: Check Blender Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python -m py_compile scripts/blender/render_previs.py
      - name: Check local links and npm publication boundary
        run: npm run test:repo
